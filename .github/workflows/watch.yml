name: si-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: si-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check watched .si domains
        env:
          SI_DOMAINS: ${{ vars.SI_DOMAINS }}
        run: python3 check.py
